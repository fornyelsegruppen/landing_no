name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: takfornyelse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d takfornyelse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/takfornyelse_test?sslmode=disable
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/takfornyelse_test?sslmode=disable
      PAYLOAD_SECRET: ci-only-payload-secret-with-more-than-32-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      FEATURE_AI_DRAFTS: "false"
      FEATURE_ROOF_MEASUREMENT: "false"
      FEATURE_CUSTOMER_QUOTES: "false"
      FEATURE_CONTRACT_SIGNING: "false"
      FEATURE_WORKER_PORTAL: "false"
      FEATURE_AUTOMATED_REMINDERS: "false"
      FEATURE_SEO_SCHEDULER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm run test:ci:unit

      - name: Migration up/down tests
        run: npm run test:ci:migrations

      - name: Bootstrap empty PostgreSQL schema
        run: node scripts/push-schema-jiti.mjs --baseline-current-migrations

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application against PostgreSQL
        run: npm run build

      - name: Public browser smoke against production build
        run: npm run test:e2e

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
